<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parallel-World Self - Tarot Selection</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
      background: #000;
      color: #ffffff;
      overflow-x: hidden;
    }

    /* 全体コンテナ */
   .container {
      width: 100vw;
      min-height: 100vh;
      background: url("{{ url_for('static', filename='image/haikei.png') }}") center center / cover no-repeat;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.5rem;
      position: relative;
    }
    
    .container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.3);
      z-index: 1;
    }

    .container > * {
      position: relative;
      z-index: 2;
    }

    .header-title {
      font-size: clamp(1.8rem, 3.8vw, 3.5rem);
      font-weight: 700;
      color: #F8F3F3;
      text-align: center;
      margin-bottom: 0.5rem;
      text-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .header-sub {
      font-size: clamp(1rem, 2vw, 1.8rem);
      font-weight: 400;
      color: rgba(255, 255, 255, 0.9);
      text-align: center;
      margin-bottom: 2rem;
      text-shadow: 0 1px 4px rgba(0,0,0,0.2);
    }

    .content-container {
      width: min(1200px, 95vw);
      display: flex;
      flex-direction: column;
      gap: 2rem;
      align-items: center;
    }

    .card-section-title {
      font-size: clamp(1.1rem, 2vw, 1.6rem);
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 1px 3px rgba(0,0,0,0.3);
      text-align: center;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 1.2rem;
      width: 100%;
      justify-items: center;
    }

    .tarot-card {
      width: 100%;
      max-width: 170px;
      background: transparent;
      border: none;
      box-shadow: none;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }

    .tarot-card:hover {
      transform: translateY(-8px) scale(1.03);
    }

    .tarot-card.selected .tarot-card-image {
      border-color: #00F0FF;
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.8);
    }

    .tarot-card-image {
      width: 100%;
      aspect-ratio: 180 / 241;
      object-fit: cover;
      border-radius: 12px;
      border: 2px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
      transition: all 0.3s ease;
    }

    .card-name {
      font-size: 0.95rem;
      font-weight: 800;
      color: #ffffff;
      text-align: center;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    .form-group {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      margin-top: 1rem;
    }

    .form-label {
      font-size: clamp(1.1rem, 2.2vw, 1.6rem);
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 1px 3px rgba(0,0,0,0.3);
      text-align: center;
    }

    .form-input {
      width: 100%;
      height: 65px;
      padding: 0 1.5rem;
      background: rgba(255, 255, 255, 0.2);
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-radius: 12px;
      backdrop-filter: blur(10px);
      font-size: clamp(1rem, 1.5vw, 1.25rem);
      color: #ffffff;
      outline: none;
      transition: all 0.3s ease;
    }
    .form-input::placeholder {
      color: rgba(255, 255, 255, 0.65);
    }
    .form-input:focus {
      background: rgba(255, 255, 255, 0.3);
      border-color: #00F0FF;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.5);
    }

    .submit-btn-wrapper {
      display: flex;
      justify-content: center;
      margin-top: 1.5rem;
    }

    .submit-btn {
      width: min(240px, 60vw);
      height: 60px;
      background: rgba(255, 255, 255, 0.25);
      border: 2px solid rgba(255, 255, 255, 0.5);
      border-radius: 50px;
      backdrop-filter: blur(10px);
      color: #ffffff;
      font-size: 1.5rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    }
    .submit-btn:hover {
      background: rgba(255, 255, 255, 0.4);
      border-color: #00F0FF;
      color: #00F0FF;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.6);
      transform: scale(1.03);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1 class="header-title">貴方はどんな人生を歩んできましたか？</h1>
    <p class="header-sub">貴方はどんなキャリアを選んできましたか</p>

    <!-- form タグで全体を囲み、action="/save-career" method="POST" に設定 -->
    <form class="content-container" action="/save-career" method="POST">

      <div class="card-section-title">直感で運命のカードを選択してください</div>
      
      <!-- 選択されたカード名を保持する隠しフィールド -->
      <input type="hidden" name="tarot_card" id="selectedCard" value="理系大学">

      <div class="card-grid">

        <div class="tarot-card selected" onclick="selectCard(this, '理系大学')">
          <img src="static/image/rikei.jpg" alt="理系大学" class="tarot-card-image">
          <div class="card-name">理系大学</div>
        </div>

        <div class="tarot-card" onclick="selectCard(this, '文系大学')">
          <img src="static/image/bunkei.jpg" alt="文系大学" class="tarot-card-image">
          <div class="card-name">文系大学</div>
        </div>

        <div class="tarot-card" onclick="selectCard(this, '就職')">
          <img src="static/image/syu-syoku.jpg" alt="就職" class="tarot-card-image">
          <div class="card-name">就職</div>
        </div>

        <div class="tarot-card" onclick="selectCard(this, '企業')">
          <img src="static/image/kigyou.jpg" alt="企業" class="tarot-card-image">
          <div class="card-name">企業</div>
        </div>

        <div class="tarot-card" onclick="selectCard(this, '芸術')">
          <img src="static/image/geijutu.jpg" alt="芸術" class="tarot-card-image">
          <div class="card-name">芸術</div>
        </div>

        <div class="tarot-card" onclick="selectCard(this, '専門学校')">
          <img src="static/image/sennmonn.jpg" alt="専門学校" class="tarot-card-image">
          <div class="card-name">専門学校</div>
        </div>

      </div>

      <div class="form-group">
        <label class="form-label">そのキャリアを選ぶ際、どのような選択肢で迷いましたか？</label>
        <!-- name="hesitation" を追加してPythonで受け取れるようにする -->
        <input type="text" name="hesitation" class="form-input" placeholder="例：大学進学時に情報学部と経済学部で迷った / 地元の企業と東京のIT企業で迷った" required>
      </div>

      <div class="submit-btn-wrapper">
        <button type="submit" class="submit-btn">次へ</button>
      </div>

    </form>
  </div>

  <script>
    function selectCard(element, cardName) {
      document.querySelectorAll('.tarot-card').forEach(card => {
        card.classList.remove('selected');
      });
      element.classList.add('selected');
      
      // 隠しinputに選ばれたカード名を設定
      document.getElementById('selectedCard').value = cardName;
    }
  </script>
</body>
</html>
