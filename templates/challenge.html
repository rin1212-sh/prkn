<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PARALLEL ME｜人生のアンケート - Challenge</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    :root {
      color-scheme: dark;
    }
    body, html {
      width: 100%;
      min-height: 100vh;
      font-family: Inter, "Noto Sans JP", "Yu Gothic", sans-serif;
      color: #fff;
      background: #101525;
      overflow-x: hidden;
    }

    /* 全体コンテナ（共通背景＆縦方向の中央配置） */
     /* 全体コンテナ（共通のメッシュグラデーション） */
    .container {
      width: 100vw;
      min-height: 100vh;
      background: url("{{ url_for('static', filename='image/haikei.png') }}") center center / cover no-repeat;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.5rem;
      position: relative;
    }

    /* 背景の視認性を高めるための黒オーバーレイ */
    .container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.35);
      z-index: 1;
    }

    /* 中身の要素をオーバーレイの上に配置 */
    .container > * {
      position: relative;
      z-index: 2;
    }

    /* ヘッダータイトルグループ */
    .header-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 0.5rem;
    }

    .header-title {
      font-size: clamp(1.8rem, 3.5vw, 3rem);
      font-weight: 700;
      color: #F8F3F3;
      text-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    .header-sub {
      font-size: clamp(1.2rem, 2.2vw, 1.8rem);
      font-weight: 400;
      color: rgba(255, 255, 255, 0.9);
      text-shadow: 0 1px 4px rgba(0,0,0,0.3);
    }

    /* フォーム全体のコンテナ */
    .form-container {
      width: min(1221px, 92vw);
      display: flex;
      flex-direction: column;
      gap: 2rem;
      align-items: center;
    }

    /* 各入力グループ */
    .input-group {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .input-label {
      font-size: clamp(1.1rem, 1.8vw, 1.5rem);
      font-weight: 400;
      color: #ffffff;
      text-align: center;
      text-shadow: 0 1px 3px rgba(0,0,0,0.4);
    }

    /* すりガラス風の大きなテキストエリア */
    .form-textarea {
      width: 100%;
      height: 137px;
      padding: 1.2rem 1.5rem;
      background: rgba(217, 217, 217, 0.18);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 12px;
      backdrop-filter: blur(12px);
      font-size: clamp(1rem, 1.3vw, 1.2rem);
      color: #ffffff;
      outline: none;
      resize: none;
      transition: all 0.3s ease;
      font-family: Inter, "Noto Sans JP", sans-serif;
      box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.25);
    }

    .form-textarea::placeholder {
      color: rgba(255, 255, 255, 0.55);
    }

    .form-textarea:focus {
      background: rgba(217, 217, 217, 0.28);
      border-color: #0EFEF6;
      box-shadow: 0 0 20px rgba(14, 254, 246, 0.5);
    }

    /* 次へボタン */
    .submit-btn-wrapper {
      display: flex;
      justify-content: center;
      margin-top: 0.5rem;
    }

    .submit-btn {
      width: min(236px, 60vw);
      height: 65px;
      background: rgba(217, 217, 217, 0.25);
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-radius: 50px;
      backdrop-filter: blur(10px);
      color: #ffffff;
      font-size: clamp(1.2rem, 1.8vw, 1.5rem);
      font-weight: 900;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    .submit-btn:hover {
      background: rgba(255, 255, 255, 0.4);
      border-color: #0EFEF6;
      color: #0EFEF6;
      box-shadow: 0 0 25px rgba(14, 254, 246, 0.6);
      transform: scale(1.03);
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- ヘッダータイトル -->
    <div class="header-group">
      <h1 class="header-title">貴方はどんな人生を歩んできましたか？</h1>
      <p class="header-sub">貴方は人生でどんなことに挑戦してきましたか</p>
    </div>

    <!-- フォームタグで全体を囲み、POSTで /save-challenge に送る -->
    <form action="/save-challenge" method="POST" class="form-container">
      
      <!-- 1つ目の質問 (name属性に challenge_card を指定) -->
      <div class="input-group">
        <label class="input-label">今現在貴方が打ち込んでいることは何ですか？（例:学業）</label>
        <textarea name="utikomu_desc" class="form-textarea" placeholder="例：大学でのデータ分析やプログラミングの学習、資格の取得など..." required></textarea>
      </div>

      <!-- 2つ目の質問 (name属性に challenge_desc を指定) -->
      <div class="input-group">
        <label class="input-label">本当はやりたかったことは何ですか？</label>
        <textarea name="yaritai_desc" class="form-textarea" placeholder="例：本当はもっとクリエイティブな表現や、別の分野への挑戦をしたかった..." required></textarea>
      </div>

      <!-- 次へボタン (type="submit" に変更) -->
      <div class="submit-btn-wrapper">
        <button type="submit" class="submit-btn">次へ</button>
      </div>

    </form>

  </div>

</body>
</html>
