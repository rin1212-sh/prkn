<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parallel World Self - Result</title>
  
  <!-- タロット・ミステリアス風フォント（Cinzel & Shippori Mincho）の読み込み -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Shippori+Mincho:wght@500;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      min-height: 100vh;
      font-family: 'Shippori Mincho', 'Cinzel', serif;
      background: #000;
      color: #ffffff;
      overflow-x: hidden;
    }

    /* 全体コンテナ */
    .container {
      width: 100vw;
      min-height: 100vh;
      background: url("{{ url_for('static', filename='image/haikei.png') }}") center center / cover no-repeat fixed;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem;
      position: relative;
      gap: 2.5rem;
    }

    /* 接続後の異世界感を引き立てるグラデーション付き暗調オーバーレイ */
    .container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, rgba(14, 254, 239, 0.08) 0%, rgba(5, 5, 16, 0.75) 100%);
      z-index: 1;
    }

    .container > * {
      position: relative;
      z-index: 2;
    }

    /* ヘッダーエリア */
    .header-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.6rem;
      text-align: center;
    }

    .connection-badge {
      font-size: clamp(0.85rem, 1.4vw, 1.05rem);
      color: #0efeef;
      letter-spacing: 0.25em;
      text-shadow: 0 0 10px rgba(14, 254, 239, 0.8);
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .connection-badge::before, .connection-badge::after {
      content: '✦';
      font-size: 0.8em;
    }

    .header-title {
      font-size: clamp(2rem, 4.2vw, 3.4rem);
      font-weight: 800;
      color: #f7f3e8;
      letter-spacing: 0.08em;
      text-shadow: 0 0 20px rgba(212, 175, 55, 0.4), 0 4px 12px rgba(0,0,0,0.9);
    }

    /* 魔法陣・タロットフレーム（結果カード） */
    .result-card {
      position: relative;
      width: min(950px, 92vw);
      background: rgba(12, 16, 28, 0.75);
      border: 1px solid rgba(212, 175, 55, 0.45);
      border-radius: 16px;
      backdrop-filter: blur(14px);
      padding: 3rem 2.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.8rem;
      box-shadow: 0 0 35px rgba(14, 254, 239, 0.15), 0 15px 45px rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(212, 175, 55, 0.1);
      overflow: hidden;
    }

    /* 額縁の四隅の装飾 */
    .result-card::before {
      content: '✦';
      position: absolute;
      top: 12px;
      left: 16px;
      color: rgba(212, 175, 55, 0.6);
      font-size: 1.1rem;
    }

    .result-card::after {
      content: '✦';
      position: absolute;
      bottom: 12px;
      right: 16px;
      color: rgba(212, 175, 55, 0.6);
      font-size: 1.1rem;
    }

    /* AIテキスト表示エリア */
    .result-description {
      font-size: clamp(1.05rem, 1.6vw, 1.25rem);
      font-weight: 500;
      color: #f0ede6;
      line-height: 2;
      background: rgba(20, 26, 42, 0.5);
      padding: 2rem;
      border-radius: 10px;
      border: 1px solid rgba(14, 254, 239, 0.25);
      letter-spacing: 0.05em;
      box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.5);
    }

    /* 会話に進むボタン（次元跳躍用の光るボタン） */
    .submit-btn-wrapper {
      display: flex;
      justify-content: center;
      margin-top: 0.5rem;
    }

    .submit-btn {
      width: min(340px, 80vw);
      height: 65px;
      background: rgba(14, 254, 239, 0.12);
      border: 2px solid #0efeef;
      border-radius: 50px;
      backdrop-filter: blur(10px);
      color: #f7f3e8;
      font-family: 'Shippori Mincho', serif;
      font-size: clamp(1.2rem, 1.8vw, 1.5rem);
      font-weight: 700;
      letter-spacing: 0.15em;
      cursor: pointer;
      transition: all 0.4s ease;
      box-shadow: 0 0 25px rgba(14, 254, 239, 0.3);
      outline: none;
    }

    .submit-btn:hover {
      background: #0efeef;
      color: #050b14;
      box-shadow: 0 0 45px rgba(14, 254, 239, 0.9), 0 0 20px rgba(255, 255, 255, 0.8);
      transform: scale(1.04);
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- ヘッダー -->
    <div class="header-group">
      <div class="connection-badge">PARALLEL DIMENSION CONNECTED</div>
      <h1 class="header-title">もう一人のあなた...</h1>
    </div>

    <!-- 結果カードフレーム -->
    <div class="result-card">
      <div class="result-description" style="white-space: pre-wrap;">{{ ai_output }}</div>
    </div>

    <!-- 会話に進むボタン -->
    <div class="submit-btn-wrapper">
      <button class="submit-btn" onclick="location.href='/chat';">会話に進む ➔</button>
    </div>

  </div>

</body>
</html>
