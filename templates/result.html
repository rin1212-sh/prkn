<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parallel-World Self - Result</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
      background: #000;
      color: #ffffff;
      overflow-x: hidden;
    }

        /* 全体コンテナ（共通のメッシュグラデーション） */
    .container {
      width: 100vw;
      min-height: 100vh;
      background: url("{{ url_for('static', filename='image/haikei.png') }}") center center / cover no-repeat;  
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.5rem;
      position: relative;
    }

    /* 背景画像の上に少し暗いオーバーレイを敷いて文字を見やすくする */
    .container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.25);
      z-index: 1;
    }

    /* コンテンツをオーバーレイの上に表示 */
    .header-title,
    .result-card,
    .submit-btn-wrapper {
      position: relative;
      z-index: 2;
    }

    /* ヘッダータイトル（もう一人のあなた...） */
    .header-title {
      font-size: clamp(2rem, 4vw, 3.5rem);
      font-weight: 700;
      color: #F8F3F3;
      text-align: center;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7);
    }

    /* 結果カード（淡いブルーのネオン枠 ＆ すりガラス） */
    .result-card {
      width: min(1000px, 92vw);
      background: rgba(10, 15, 30, 0.65); /* 背景になじむ深めのダークカラー */
      border: 4px solid #B2B4F7;
      border-radius: 20px;
      backdrop-filter: blur(12px);
      padding: 2.5rem 2rem;
      display: flex;
      flex-direction: column;
      gap: 2rem;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.5), inset 0 0 25px rgba(178, 180, 247, 0.25);
    }

    /* 一言で表した要約タイトル */
    .result-headline {
      font-size: clamp(1.3rem, 2.2vw, 1.8rem);
      font-weight: 700;
      color: #ffffff;
      text-align: center;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
      line-height: 1.5;
    }

    /* 詳しい説明文エリア */
    .result-description {
      font-size: clamp(1rem, 1.6vw, 1.25rem);
      font-weight: 400;
      color: rgba(255, 255, 255, 0.95);
      line-height: 1.8;
      background: rgba(255, 255, 255, 0.1);
      padding: 1.5rem;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.25);
    }

    /* 「会話に進む」ボタン */
    .submit-btn-wrapper {
      display: flex;
      justify-content: center;
      margin-top: 0.5rem;
    }

    .submit-btn {
      width: min(350px, 80vw);
      height: 65px;
      background: rgba(255, 255, 255, 0.9);
      border: 2px solid rgba(255, 255, 255, 0.8);
      border-radius: 50px;
      backdrop-filter: blur(10px);
      color: #0B0000;
      font-size: clamp(1.2rem, 2vw, 1.5rem);
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
    }
    .submit-btn:hover {
      background: #00F0FF;
      border-color: #00F0FF;
      color: #ffffff;
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.9);
      transform: scale(1.03);
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- ヘッダータイトル -->
    <h1 class="header-title">もう一人のあなた...</h1>

    <!-- 分析結果を包むカードフレーム -->
    <div class="result-card">
      
      <!-- 一言要約 -->
      <div class="result-headline">
        「別ルートの選択によって、新たな領域へ挑戦し続ける開拓者としてのあなた」
      </div>

      <!-- 詳しい説明 -->
      <div class="result-description">
        もしもあの時、別の選択肢を選んでいたら――。あなたは安定した環境を離れ、自らの直感を頼りに未知のフィールドへ飛び込んでいました。周囲との深い絆を大切にしながらも、孤高のクリエイターとして独自の道を切り拓き、今では多くの人々に影響を与える存在となっています。
      </div>

    </div>

    <!-- 会話に進むボタン（/chat へ遷移） -->
    <div class="submit-btn-wrapper">
      <button class="submit-btn" onclick="location.href='/chat';">会話に進む</button>
    </div>

  </div>

</body>
</html>
