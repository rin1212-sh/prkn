<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parallel-World Self - Top</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
      background: #000;
      color: #ffffff;
      overflow-x: hidden;
    }

    /* 全体コンテナ（メッシュグラデーション ＆ 中央寄せ） */
    .container {
      width: 100vw;
      min-height: 100vh;
      background: linear-gradient(135deg, #E8557D 0%, #F39C59 25%, #E3CA65 50%, #1BB1A5 85%, #0F8DA2 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center; /* 縦方向の中央にまとめて余白をスッキリさせる */
      padding: 2.5rem 1.5rem;
      position: relative;
      gap: 3rem; /* 要素ごとの間隔をきれいに保つ */
    }

    /* タイトルセクション */
    .hero-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 0.8rem;
    }

    .header-title-top {
      font-size: clamp(2rem, 4.5vw, 4rem);
      font-weight: 800;
      color: rgba(0, 0, 0, 0.95);
      text-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }

    .header-title-main {
      font-size: clamp(2rem, 4.5vw, 4rem);
      font-weight: 800;
      color: #000000;
      text-shadow: 0 4px 15px rgba(0,0,0,0.2);
      line-height: 1.2;
    }

    /* アクションボタン（CTA） */
    .cta-button {
      width: min(320px, 80vw);
      height: 70px;
      background: rgba(255, 255, 255, 0.25);
      border: 2px solid rgba(255, 255, 255, 0.6);
      border-radius: 50px;
      backdrop-filter: blur(12px);
      color: #ffffff;
      font-size: clamp(1.1rem, 1.8vw, 1.4rem);
      font-weight: 800;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 6px 20px rgba(0,0,0,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
    }
    .cta-button:hover {
      background: rgba(255, 255, 255, 0.4);
      border-color: #00F0FF;
      color: #00F0FF;
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.6);
      transform: scale(1.03);
    }

    /* サブ説明文 */
    .hero-footer-text {
      font-size: clamp(1.4rem, 1.9vw, 1.6rem);
      font-weight: 500;
      color: rgba(255, 255, 255, 0.9);
      text-align: center;
      line-height: 1.6;
      text-shadow: 0 1px 4px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- タイトル部分 -->
    <div class="hero-header">
      <div class="header-title-top">あの日、</div>
      <h1 class="header-title-main">選択しなかった人生を生きる自分</h1>
    </div>

    <!-- メインボタン（クリックでプロファイル画面へ） -->
    <a href="profile.html" class="cta-button">
      別世界の自分と話す
    </a>

    <!-- 下部の説明文 -->
    <div class="hero-footer-text">
      あなたが選択しなかった世界で生きているあなたは、<br>
      今何を思って何をしているのか、自分を見つめなおしてみるきっかけに
    </div>

  </div>

</body>
</html>
