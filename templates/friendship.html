<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parallel World Self - Relationship Selection</title>
  
  <!-- タロット・ミステリアス風フォント（Cinzel & Shippori Mincho）の読み込み -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Shippori+Mincho:wght@500;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      min-height: 100vh;
      font-family: 'Shippori Mincho', 'Cinzel', serif;
      background: #000;
      color: #ffffff;
      overflow-x: hidden;
    }

    /* 全体コンテナ */
    .container {
      width: 100vw;
      min-height: 100vh;
      background: url("{{ url_for('static', filename='image/haikei.png') }}") center center / cover no-repeat fixed;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.5rem;
      position: relative;
    }

    .container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(5, 5, 14, 0.65);
      z-index: 1;
    }

    .container > * {
      position: relative;
      z-index: 2;
    }

    /* ヘッダーエリア */
    .header-title {
      font-size: clamp(1.8rem, 3.8vw, 3.2rem);
      font-weight: 800;
      color: #f7f3e8;
      text-align: center;
      margin-bottom: 0.5rem;
      letter-spacing: 0.06em;
      text-shadow: 0 0 15px rgba(212, 175, 55, 0.4), 0 4px 10px rgba(0,0,0,0.8);
    }

    .header-sub {
      font-size: clamp(0.95rem, 1.8vw, 1.3rem);
      font-weight: 500;
      color: #c5c1b6;
      text-align: center;
      margin-bottom: 2.5rem;
      letter-spacing: 0.05em;
    }

    /* メインコンテンツ容器 */
    .content-container {
      width: min(1200px, 92vw);
      display: flex;
      flex-direction: column;
      gap: 2.2rem;
      align-items: center;
    }

    .card-section-title {
      font-size: clamp(1.1rem, 2vw, 1.4rem);
      font-weight: 700;
      color: #ebdcb9;
      letter-spacing: 0.06em;
      text-align: center;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .card-section-title::before, .card-section-title::after {
      content: '✦';
      color: #0efeef;
      font-size: 0.85em;
      text-shadow: 0 0 8px #0efeef;
    }

    /* 4列カードグリッド */
    .card-grid-4 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1.5rem;
      width: 100%;
      justify-items: center;
    }

    /* タロットカード要素 */
    .tarot-card {
      position: relative;
      width: 100%;
      max-width: 212px;
      background: transparent;
      border: none;
      cursor: pointer;
      transition: all 0.35s cubic-bezier(0.25, 1, 0.5, 1);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.7rem;
    }

    .tarot-card:hover {
      transform: translateY(-8px) scale(1.03);
    }

    /* カード画像枠（金枠＆発光） */
    .tarot-card-image {
      width: 100%;
      aspect-ratio: 212 / 284;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid rgba(212, 175, 55, 0.4);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
      transition: all 0.35s ease;
    }

    .tarot-card:hover .tarot-card-image {
      border-color: rgba(212, 175, 55, 0.9);
      box-shadow: 0 10px 25px rgba(212, 175, 55, 0.3);
    }

    /* 選択されたカード */
    .tarot-card.selected .tarot-card-image {
      border: 2px solid #0efeef;
      box-shadow: 0 0 25px rgba(14, 254, 239, 0.7), 0 0 10px rgba(14, 254, 239, 0.4);
    }

    .card-name {
      font-size: 1.05rem;
      font-weight: 700;
      color: #f7f3e8;
      text-align: center;
      letter-spacing: 0.05em;
      text-shadow: 0 2px 5px rgba(0,0,0,0.8);
      transition: color 0.3s ease;
    }

    .tarot-card.selected .card-name {
      color: #0efeef;
      text-shadow: 0 0 8px rgba(14, 254, 239, 0.6);
    }

    /* フォーム入力エリア */
    .form-group {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }

    .form-label {
      font-size: clamp(1.05rem, 2vw, 1.35rem);
      font-weight: 700;
      color: #ebdcb9;
      letter-spacing: 0.05em;
      text-align: center;
      line-height: 1.5;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    .form-input {
      width: 100%;
      height: 60px;
      padding: 0 1.5rem;
      background: rgba(15, 18, 28, 0.65);
      border: 1px solid rgba(212, 175, 55, 0.4);
      border-radius: 8px;
      backdrop-filter: blur(8px);
      font-family: 'Shippori Mincho', serif;
      font-size: clamp(1rem, 1.5vw, 1.15rem);
      color: #ffffff;
      outline: none;
      transition: all 0.3s ease;
      box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5);
    }

    .form-input::placeholder {
      color: rgba(220, 215, 200, 0.35);
    }

    .form-input:focus {
      background: rgba(15, 18, 28, 0.85);
      border-color: #0efeef;
      box-shadow: 0 0 18px rgba(14, 254, 239, 0.5), inset 0 0 8px rgba(14, 254, 239, 0.2);
    }

    /* 送信ボタン */
    .submit-btn-wrapper {
      display: flex;
      justify-content: center;
      margin-top: 1rem;
    }

    .submit-btn {
      width: min(280px, 70vw);
      height: 60px;
      background: rgba(212, 175, 55, 0.15);
      border: 2px solid #d4af37;
      border-radius: 50px;
      backdrop-filter: blur(10px);
      color: #f7f3e8;
      font-family: 'Shippori Mincho', serif;
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      cursor: pointer;
      transition: all 0.4s ease;
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.25);
      outline: none;
    }

    .submit-btn:hover {
      background: #d4af37;
      color: #050b14;
      box-shadow: 0 0 35px rgba(212, 175, 55, 0.8), 0 0 15px rgba(255, 255, 255, 0.6);
      transform: scale(1.03);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1 class="header-title">貴方はどんな人生を歩んできましたか？</h1>
    <p class="header-sub">どのような人間関係の中生きてきましたか？</p>

    <!-- フォーム部分 -->
    <form class="content-container" action="/save-friendship" method="POST">

      <div class="card-section-title">直感で人間関係を表すカードを選択してください</div>
      
      <!-- 選択されたカード名を保持する隠しフィールド -->
      <input type="hidden" name="friendship_card" id="selectedFriendship" value="仲間">

      <div class="card-grid-4">

        <div class="tarot-card selected" onclick="selectCard(this, '仲間')">
          <img src="static/image/nakama.jpg" alt="仲間" class="tarot-card-image">
          <div class="card-name">仲間</div>
        </div>

        <div class="tarot-card" onclick="selectCard(this, '出会い')">
          <img src="static/image/deai.jpg" alt="出会い" class="tarot-card-image">
          <div class="card-name">出会い</div>
        </div>

        <div class="tarot-card" onclick="selectCard(this, '親友')">
          <img src="static/image/kizuna.jpg" alt="親友" class="tarot-card-image">
          <div class="card-name">親友</div>
        </div>

        <div class="tarot-card" onclick="selectCard(this, '孤高')">
          <img src="static/image/kokou.jpg" alt="孤高" class="tarot-card-image">
          <div class="card-name">孤高</div>
        </div>

      </div>

      <!-- 入力フォーム -->
      <div class="form-group">
        <label class="form-label">そのとき、本当はどのような人間関係を築きたいと思っていましたか？</label>
        <input type="text" name="friendship_desc" class="form-input" placeholder="例：表面的な付き合いではなく、本音で議論できる仲間をつくりたかった" required>
      </div>

      <!-- 次へボタン -->
      <div class="submit-btn-wrapper">
        <button type="submit" class="submit-btn">次へ</button>
      </div>

    </form>
  </div>

  <script>
    function selectCard(element, cardName) {
      document.querySelectorAll('.tarot-card').forEach(card => {
        card.classList.remove('selected');
      });
      element.classList.add('selected');
      
      document.getElementById('selectedFriendship').value = cardName;
    }
  </script>
</body>
</html>
