<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parallel-World Self - AI Chat</title>
  
  <!-- フォント読み込み（Cinzel & Shippori Mincho） -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Shippori+Mincho:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100vh;
      font-family: 'Shippori Mincho', serif;
      background: #050508;
      color: #e2e8f0;
      overflow: hidden;
    }

    /* 全体コンテナ */
    .container {
      width: 100vw;
      min-height: 100vh;
      background: url("{{ url_for('static', filename='image/haikei.png') }}") center center / cover no-repeat;  
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      position: relative;
    }

    /* タロット風ダーク＆ルミナスオーバーレイ */
    .container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, rgba(15, 23, 42, 0.4) 0%, rgba(5, 5, 8, 0.88) 100%);
      z-index: 1;
    }

    /* 異世界通信の「走査线（スキャンライン）」エフェクト */
    .scanline {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0),
        rgba(255, 255, 255, 0) 50%,
        rgba(14, 254, 239, 0.03) 50%,
        rgba(14, 254, 239, 0.03)
      );
      background-size: 100% 4px;
      pointer-events: none;
      z-index: 2;
    }

    /* メインエリア */
    .main-wrapper {
      position: relative;
      z-index: 3;
      width: min(1000px, 94vw);
      height: 100vh;
      max-height: calc(100vh - 3rem);
      display: flex;
      flex-direction: column;
      gap: 1rem;
      align-items: center;
      justify-content: space-between;
    }

    /* ヘッダーエリア（ステータス表示付き） */
    .header-area {
      text-align: center;
      margin-top: 0.2rem;
    }

    .header-title {
      font-family: 'Cinzel', serif;
      font-size: clamp(1.2rem, 2vw, 1.5rem);
      letter-spacing: 0.25em;
      color: #d4af37;
      text-shadow: 0 0 12px rgba(212, 175, 55, 0.4);
      text-transform: uppercase;
    }

    /* 異世界通信インジケーター */
    .signal-status {
      font-family: 'Cinzel', monospace;
      font-size: 0.75rem;
      color: #0efeef;
      letter-spacing: 0.2em;
      opacity: 0.8;
      margin-top: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .signal-dot {
      width: 6px;
      height: 6px;
      background-color: #0efeef;
      border-radius: 50%;
      box-shadow: 0 0 8px #0efeef;
      animation: pulse 2s infinite;
    }

    /* 1. チャットログ表示エリア */
    .chat-box {
      width: 100%;
      flex: 1;
      height: 55vh;
      min-height: 300px;
      background: rgba(13, 18, 30, 0.6);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 20px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5),
                  inset 0 0 15px rgba(212, 175, 55, 0.05);
      padding: 1.8rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .chat-box::-webkit-scrollbar {
      width: 5px;
    }
    .chat-box::-webkit-scrollbar-thumb {
      background: rgba(212, 175, 55, 0.4);
      border-radius: 3px;
    }

    /* メッセージ行 */
    .message-row {
      display: flex;
      align-items: flex-start;
      gap: 1rem;
      max-width: 85%;
    }

    .message-row.ai {
      align-self: flex-start;
    }

    .message-row.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    /* アバター */
    .avatar {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Cinzel', serif;
      font-weight: 700;
      font-size: 0.85rem;
      flex-shrink: 0;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      letter-spacing: 0.05em;
    }

    .avatar.ai {
      background: radial-gradient(circle, rgba(14, 254, 246, 0.25) 0%, rgba(5, 5, 8, 0.85) 100%);
      border: 1.5px solid #0efeef;
      color: #0efeef;
      text-shadow: 0 0 8px rgba(14, 254, 239, 0.8);
      box-shadow: 0 0 12px rgba(14, 254, 239, 0.3);
      animation: hologram 4s infinite alternate;
    }

    .avatar.user {
      background: radial-gradient(circle, rgba(212, 175, 55, 0.25) 0%, rgba(5, 5, 8, 0.85) 100%);
      border: 1.5px solid #d4af37;
      color: #f3e5ab;
      text-shadow: 0 0 8px rgba(212, 175, 55, 0.8);
      box-shadow: 0 0 12px rgba(212, 175, 55, 0.3);
    }

    /* 吹き出しバブル */
    .bubble {
      padding: 1.1rem 1.4rem;
      border-radius: 16px;
      font-size: clamp(0.95rem, 1.3vw, 1.05rem);
      line-height: 1.7;
      backdrop-filter: blur(8px);
      letter-spacing: 0.03em;
      word-break: break-word;
    }

    .message-row.ai .bubble {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(14, 254, 239, 0.35);
      color: #e2e8f0;
      border-top-left-radius: 2px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3), 0 0 10px rgba(14, 254, 239, 0.08);
    }

    .message-row.user .bubble {
      background: rgba(30, 27, 20, 0.75);
      border: 1px solid rgba(212, 175, 55, 0.45);
      color: #f8fafc;
      border-top-right-radius: 2px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3), 0 0 10px rgba(212, 175, 55, 0.1);
    }

    /* 2. 入力コントロールエリア */
    .input-container {
      width: 100%;
      background: rgba(13, 18, 30, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(212, 175, 55, 0.35);
      border-radius: 16px;
      padding: 0.8rem 1.2rem;
      display: flex;
      gap: 1rem;
      align-items: center;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
    }

    .chat-input {
      flex: 1;
      height: 48px;
      background: rgba(5, 5, 8, 0.6);
      border: 1px solid rgba(14, 254, 239, 0.35);
      border-radius: 10px;
      padding: 0 1.2rem;
      color: #ffffff;
      font-family: 'Shippori Mincho', serif;
      font-size: 1rem;
      outline: none;
      transition: all 0.3s ease;
    }

    .chat-input::placeholder {
      color: rgba(226, 232, 240, 0.4);
      letter-spacing: 0.05em;
    }

    .chat-input:focus {
      border-color: #0efeef;
      box-shadow: 0 0 15px rgba(14, 254, 239, 0.4);
      background: rgba(5, 5, 8, 0.85);
    }

    .send-btn {
      width: 120px;
      height: 48px;
      background: linear-gradient(135deg, rgba(14, 254, 239, 0.25) 0%, rgba(14, 254, 239, 0.05) 100%);
      border: 1px solid #0efeef;
      border-radius: 10px;
      color: #0efeef;
      font-family: 'Cinzel', 'Shippori Mincho', serif;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 0 12px rgba(14, 254, 239, 0.2);
    }

    .send-btn:hover {
      background: #0efeef;
      color: #050508;
      box-shadow: 0 0 25px rgba(14, 254, 239, 0.7);
      transform: translateY(-1px);
    }

    /* 3. 別世界との接続を切るボタン */
    .disconnect-btn-wrapper {
      margin-bottom: 0.5rem;
    }

    .disconnect-btn {
      width: min(480px, 85vw);
      height: 50px;
      background: linear-gradient(135deg, rgba(212, 175, 55, 0.15) 0%, rgba(15, 23, 42, 0.6) 100%);
      border: 1px solid #d4af37;
      border-radius: 30px;
      backdrop-filter: blur(10px);
      color: #f3e5ab;
      font-family: 'Shippori Mincho', serif;
      font-size: clamp(0.95rem, 1.8vw, 1.15rem);
      letter-spacing: 0.15em;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4), 0 0 10px rgba(212, 175, 55, 0.15);
    }

    .disconnect-btn:hover {
      background: linear-gradient(135deg, rgba(239, 68, 68, 0.25) 0%, rgba(15, 23, 42, 0.8) 100%);
      border-color: #ef4444;
      color: #fca5a5;
      box-shadow: 0 0 25px rgba(239, 68, 68, 0.4);
      transform: translateY(-2px);
    }

    /* アニメーション定義 */
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.8); }
    }

    @keyframes hologram {
      0%, 100% { filter: drop-shadow(0 0 5px rgba(14, 254, 239, 0.6)); }
      50% { filter: drop-shadow(0 0 12px rgba(14, 254, 239, 0.9)); }
    }

    @keyframes textGlow {
      0%, 100% { opacity: 0.6; text-shadow: 0 0 5px #0efeef; }
      50% { opacity: 1; text-shadow: 0 0 15px #0efeef, 0 0 20px #0efeef; }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="scanline"></div>

    <div class="main-wrapper">

      <div class="header-area">
        <h1 class="header-title">Parallel World Dialogue</h1>
        <div class="signal-status">
          <span class="signal-dot"></span>
          <span>PARALLEL LINK: ACTIVE</span>
        </div>
      </div>

      <!-- 1. 会話エリア -->
      <div class="chat-box" id="chatBox">
        
        {% for h in history %}
          {% if h.role == 'ai' %}
            <div class="message-row ai">
              <div class="avatar ai">SELF</div>
              <div class="bubble" style="white-space: pre-wrap;">{{ h.content }}</div>
            </div>
          {% else %}
            <div class="message-row user">
              <div class="avatar user">YOU</div>
              <div class="bubble" style="white-space: pre-wrap;">{{ h.content }}</div>
            </div>
          {% endif %}
        {% endfor %}

      </div>

      <!-- 2. 入力フォーム -->
      <div class="input-container">
        <input type="text" class="chat-input" id="messageInput" placeholder="テキスト入力" onkeypress="handleKeyPress(event)">
        <button class="send-btn" onclick="sendMessage()">送信</button>
      </div>

      <!-- 3. 切断ボタン（/finish へ遷移） -->
      <div class="disconnect-btn-wrapper">
        <button class="disconnect-btn" onclick="location.href='/finish';">接続を切る</button>
      </div>

    </div>
  </div>

  <script>
    async function sendMessage() {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (!text) return;

      const chatBox = document.getElementById('chatBox');

      // ユーザーメッセージを画面に追加
      const userRow = document.createElement('div');
      userRow.className = 'message-row user';
      userRow.innerHTML = `
        <div class="avatar user">YOU</div>
        <div class="bubble" style="white-space: pre-wrap;">${escapeHTML(text)}</div>
      `;
      chatBox.appendChild(userRow);

      input.value = '';
      chatBox.scrollTop = chatBox.scrollHeight;

      //  AI思考中の演出（異世界通信中ローディング）
      const loadingRow = document.createElement('div');
      loadingRow.className = 'message-row ai';
      loadingRow.id = 'loadingRow';
      loadingRow.innerHTML = `
        <div class="avatar ai">SELF</div>
        <div class="bubble" style="white-space: pre-wrap; color: #0efeef; background: rgba(14, 254, 239, 0.08);">
          <span style="display: inline-block; animation: textGlow 1.2s infinite alternate;">✦通信中…</span>
        </div>
      `;
      chatBox.appendChild(loadingRow);
      chatBox.scrollTop = chatBox.scrollHeight;

      // サーバー（Flaskの /send-message）へ送信
      try {
        const response = await fetch('/send-message', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
          },
          body: 'message=' + encodeURIComponent(text)
        });

        const data = await response.json();

        // 思考中演出を削除
        const loadingElement = document.getElementById('loadingRow');
        if (loadingElement) loadingElement.remove();

        // AIの返信を画面に追加
        const aiRow = document.createElement('div');
        aiRow.className = 'message-row ai';
        aiRow.innerHTML = `
          <div class="avatar ai">SELF</div>
          <div class="bubble" style="white-space: pre-wrap;">${escapeHTML(data.reply)}</div>
        `;
        chatBox.appendChild(aiRow);
        chatBox.scrollTop = chatBox.scrollHeight;

      } catch (error) {
        console.error('通信エラー:', error);
        const loadingElement = document.getElementById('loadingRow');
        if (loadingElement) loadingElement.remove();
      }
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') {
        sendMessage();
      }
    }

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }
  </script>
</body>
</html>
