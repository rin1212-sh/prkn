<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parallel-World Self - Loading</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
      background: #000;
      color: #ffffff;
      overflow-x: hidden;
    }

    /* 全体コンテナ（共通のメッシュグラデーション ＆ 中央寄せ） */
    .container {
      width: 100vw;
      min-height: 100vh;
      background: linear-gradient(135deg, #E8557D 0%, #F39C59 25%, #E3CA65 50%, #1BB1A5 85%, #0F8DA2 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.5rem;
      position: relative;
      gap: 2.5rem;
    }

    /* ネオンのローディングサークル（回転アニメーション） */
    .loader-spinner {
      width: 90px;
      height: 90px;
      border: 4px solid rgba(255, 255, 255, 0.2);
      border-top: 4px solid #00F0FF;
      border-radius: 50%;
      animation: spin 1.2s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite;
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.5);
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* メインメッセージ */
    .loading-title {
      font-size: clamp(1.8rem, 3.8vw, 3.2rem);
      font-weight: 700;
      color: #F8F3F3;
      text-align: center;
      text-shadow: 0 2px 10px rgba(0,0,0,0.25);
      letter-spacing: 0.05em;
    }

    /* wait... のテキスト（ほのかに点滅する演出） */
    .loading-sub {
      font-size: clamp(1.2rem, 2vw, 1.8rem);
      font-weight: 700;
      color: #ffffff;
      text-align: center;
      text-shadow: 0 0 15px rgba(0, 240, 255, 0.8);
      letter-spacing: 0.1em;
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- ローディングサークル -->
    <div class="loader-spinner"></div>

    <!-- メインテキスト -->
    <h1 class="loading-title">もう一人のあなたを生成しています</h1>

    <!-- サブテキスト (wait...) -->
    <div class="loading-sub">wait...</div>

  </div>

  <script>
    // 【おまけの自動遷移スクリプト】
    // 3.5秒後に自動でチャット画面（chat.html）へ進む仕組み（必要に応じて調整してね！）
    setTimeout(() => {
      window.location.href = 'result.html';
    }, 3500);
  </script>
</body>
</html>
