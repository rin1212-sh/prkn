<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parallel World Self - トップページ</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100vh;
      font-family: 'Inter', sans-serif;
      background: #000;
      color: #ffffff;
      overflow: hidden;
    }

    /* 異世界の扉画像を背景に設定 */
    .container {
      width: 100vw;
      height: 100vh;
     /* filename の末尾を 'image/haikei.jpg' に変更 */
     background: url("{{ url_for('static', filename='image/haikei.jpg') }}") center center / cover no-repeat;
     display: flex;
     flex-direction: column;
     align-items: center;
     justify-content: space-between;
     padding: 4rem 2rem 3rem;
     position: relative;
     }
       

    /* 背景画像を活かしつつ可読性を高めるダークオーバレイ */
    .container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, rgba(0, 0, 0, 0.2) 0%, rgba(0, 0, 0, 0.65) 100%);
      z-index: 1;
    }

    .main-wrapper {
      position: relative;
      z-index: 2;
      width: min(1200px, 92vw);
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-align: center;
    }

    /* メインタイトル */
    .main-title {
      font-size: clamp(2.5rem, 5vw, 4.5rem);
      font-weight: 700;
      line-height: 1.25;
      color: #ffffff;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.9), 0 0 30px rgba(14, 254, 246, 0.3);
      margin-top: 1rem;
    }

    /* ボタンコンテナ */
    .btn-wrapper {
      margin: auto 0;
    }

    /* 工夫した幻想的なネオン発光ボタン */
    .start-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 1.2rem 3.5rem;
      font-size: clamp(1.4rem, 2.5vw, 2.2rem);
      font-weight: 700;
      color: #ffffff;
      text-decoration: none;
      background: rgba(14, 254, 246, 0.15);
      border: 2px solid #0EFEF6;
      border-radius: 60px;
      backdrop-filter: blur(12px);
      box-shadow: 0 0 25px rgba(14, 254, 246, 0.4), inset 0 0 15px rgba(14, 254, 246, 0.2);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    /* ホバー時のバック光り演出 */
    .start-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
      transition: left 0.6s ease;
    }

    .start-btn:hover::before {
      left: 100%;
    }

    .start-btn:hover {
      background: #0EFEF6;
      color: #050B14;
      box-shadow: 0 0 45px rgba(14, 254, 246, 0.9), 0 0 15px rgba(255, 255, 255, 0.8);
      transform: scale(1.05);
    }

    /* サブコピー（グラスモフィズムカード風） */
    .sub-copy-card {
      background: rgba(10, 15, 30, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      backdrop-filter: blur(10px);
      padding: 1.5rem 2.5rem;
      max-width: 950px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      margin-bottom: 1rem;
    }

    .sub-copy-text {
      font-size: clamp(1.1rem, 2vw, 1.6rem);
      font-weight: 700;
      line-height: 1.8;
      color: #E2F9FF;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="main-wrapper">

      <!-- メインタイトル -->
      <h1 class="main-title">
        あの日、<br>選択しなかった人生を生きる自分
      </h1>

      <!-- index.html 内のボタン部分 -->
      <div class="btn-wrapper">
        <a href="{{ url_for('profile') }}" class="start-btn">
        別世界の自分と話す
        </a>
      </div>

      <!-- 下部メッセージ -->
      <div class="sub-copy-card">
        <p class="sub-copy-text">
          「もしも、あの道を選んでいたら――」<br>
          分岐点の先にいる自分と対話し、今の歩みを見つめ直す特別な体験を。
        </p>
      </div>

    </div>
  </div>

</body>
</html>
