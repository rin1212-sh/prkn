<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parallel World Self - Profile</title>
  
  <!-- タロット・ミステリアス風フォント（Cinzel & Shippori Mincho）の読み込み -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Shippori+Mincho:wght@500;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      min-height: 100vh;
      font-family: 'Shippori Mincho', 'Cinzel', serif;
      background: #000;
      color: #ffffff;
      overflow-x: hidden;
    }

    /* 全体コンテナ */
    .container {
      width: 100vw;
      min-height: 100vh;
      background: url("{{ url_for('static', filename='image/haikei.png') }}") center center / cover no-repeat fixed;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.5rem;
      position: relative;
    }

    .container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(5, 5, 14, 0.65); /* 紫がかった幻想的な暗さ */
      z-index: 1;
    }

    .container > * {
      position: relative;
      z-index: 2;
    }

    /* タイトルエリア */
    .header-title {
      font-size: clamp(1.8rem, 4vw, 3.2rem);
      font-weight: 800;
      color: #f7f3e8;
      text-align: center;
      margin-bottom: 0.5rem;
      letter-spacing: 0.06em;
      text-shadow: 0 0 15px rgba(212, 175, 55, 0.4), 0 4px 10px rgba(0,0,0,0.8);
    }
    
    .header-sub {
      font-size: clamp(0.95rem, 1.8vw, 1.3rem);
      font-weight: 500;
      color: #c5c1b6;
      text-align: center;
      margin-bottom: 2.5rem;
      letter-spacing: 0.05em;
    }

    /* フォーム容器 */
    .form-container {
      width: min(1000px, 92vw);
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }

    /* 質問ラベル（タロット記号付き） */
    .form-label {
      font-size: clamp(1.05rem, 2vw, 1.4rem);
      font-weight: 700;
      color: #ebdcb9; /* 金古美調ゴールド */
      letter-spacing: 0.05em;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    .form-label::before {
      content: '✦';
      color: #0efeef;
      font-size: 0.85em;
      text-shadow: 0 0 8px #0efeef;
    }

    /* 入力フォーム（魔法陣発光エフェクト） */
    .form-input {
      width: 100%;
      height: 58px;
      padding: 0 1.2rem;
      background: rgba(15, 18, 28, 0.65);
      border: 1px solid rgba(212, 175, 55, 0.4);
      border-radius: 8px;
      backdrop-filter: blur(8px);
      font-family: 'Shippori Mincho', serif;
      font-size: clamp(1rem, 1.5vw, 1.15rem);
      color: #ffffff;
      outline: none;
      transition: all 0.3s ease;
      box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5);
    }

    .form-input::placeholder {
      color: rgba(220, 215, 200, 0.35);
    }

    .form-input:focus {
      background: rgba(15, 18, 28, 0.85);
      border-color: #0efeef;
      box-shadow: 0 0 18px rgba(14, 254, 239, 0.5), inset 0 0 8px rgba(14, 254, 239, 0.2);
    }

    /* 口調選択グリッド */
    .tone-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 1.2rem;
      margin-top: 0.3rem;
    }

    /* タロットカード風の選択肢カード */
    .tone-card {
      position: relative;
      background: rgba(18, 22, 36, 0.65);
      border: 1px solid rgba(212, 175, 55, 0.35);
      border-radius: 10px;
      padding: 1rem;
      backdrop-filter: blur(10px);
      cursor: pointer;
      transition: all 0.35s cubic-bezier(0.25, 1, 0.5, 1);
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 90px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      overflow: hidden;
    }

    /* タロットの四隅飾り */
    .tone-card::after {
      content: '◇';
      position: absolute;
      top: 6px;
      right: 8px;
      font-size: 0.65rem;
      color: rgba(212, 175, 55, 0.4);
    }

    .tone-card:hover {
      background: rgba(25, 30, 48, 0.8);
      border-color: rgba(212, 175, 55, 0.8);
      transform: translateY(-4px);
      box-shadow: 0 8px 25px rgba(212, 175, 55, 0.25);
    }

    /* 選択状態 */
    .tone-card.selected {
      background: rgba(14, 254, 239, 0.08);
      border: 2px solid #0efeef;
      box-shadow: 0 0 25px rgba(14, 254, 239, 0.4), inset 0 0 15px rgba(14, 254, 239, 0.15);
    }

    .tone-card.selected::after {
      color: #0efeef;
      text-shadow: 0 0 5px #0efeef;
    }

    .tone-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #f7f3e8;
      margin-bottom: 0.3rem;
      letter-spacing: 0.04em;
    }

    .tone-card.selected .tone-title {
      color: #0efeef;
      text-shadow: 0 0 8px rgba(14, 254, 239, 0.6);
    }

    .tone-desc {
      font-size: 0.8rem;
      font-weight: 500;
      color: #b3b0a6;
      line-height: 1.4;
    }

    /* 送信ボタン */
    .submit-btn-wrapper {
      display: flex;
      justify-content: center;
      margin-top: 1.5rem;
    }

    .submit-btn {
      width: min(280px, 70vw);
      height: 60px;
      background: rgba(212, 175, 55, 0.15);
      border: 2px solid #d4af37;
      border-radius: 50px;
      backdrop-filter: blur(10px);
      color: #f7f3e8;
      font-family: 'Shippori Mincho', serif;
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      cursor: pointer;
      transition: all 0.4s ease;
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.25);
      outline: none;
    }

    .submit-btn:hover {
      background: #d4af37;
      color: #050b14;
      box-shadow: 0 0 35px rgba(212, 175, 55, 0.8), 0 0 15px rgba(255, 255, 255, 0.6);
      transform: scale(1.03);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1 class="header-title">あなたについて教えてください</h1>
    <p class="header-sub">別世界の自分と話すために今の自分の情報を教えてください</p>

    <form class="form-container" action="/save-profile" method="POST">
      
      <!-- 1. 立場・職業 -->
      <div class="form-group">
        <label class="form-label">現在の立場・職業を教えてください</label>
        <input type="text" name="job" class="form-input" placeholder="例：情報学部の大学生、ITエンジニア" required>
      </div>

      <!-- 2. 性格 -->
      <div class="form-group">
        <label class="form-label">自分の性格を簡潔に教えてください</label>
        <input type="text" name="personality" class="form-input" placeholder="例：安定、自由、冷静" required>
      </div>

      <!-- 3. 一人称 -->
      <div class="form-group">
        <label class="form-label">普段の一人称を教えてください</label>
        <input type="text" name="first_person" class="form-input" placeholder="例：私、僕、俺" required>
      </div>

      <!-- 4. 口調選択（選択肢全5個完全維持） -->
      <div class="form-group">
        <label class="form-label">普段の口調に近いものを選択してください</label>
        
        <input type="hidden" name="tone" id="selectedTone" value="丁寧">

        <div class="tone-grid">
          <div class="tone-card selected" onclick="selectTone(this, '丁寧')">
            <div class="tone-title">丁寧</div>
            <div class="tone-desc">です・ます調で<br>落ち着いた話し方</div>
          </div>

          <div class="tone-card" onclick="selectTone(this, 'フランク')">
            <div class="tone-title">フランク</div>
            <div class="tone-desc">ため口で、<br>友達と話すような感じ</div>
          </div>

          <div class="tone-card" onclick="selectTone(this, '素直')">
            <div class="tone-title">素直</div>
            <div class="tone-desc">思ったことを<br>ストレートに伝える</div>
          </div>

          <div class="tone-card" onclick="selectTone(this, '淡々')">
            <div class="tone-title">淡々</div>
            <div class="tone-desc">感情表現は控え目で<br>簡潔に話す</div>
          </div>

          <div class="tone-card" onclick="selectTone(this, '明るい・ノリがいい')">
            <div class="tone-title">明るい・ノリがいい</div>
            <div class="tone-desc">冗談や<br>リアクションが多い</div>
          </div>
        </div>
      </div>

      <!-- ボタン -->
      <div class="submit-btn-wrapper">
        <button type="submit" class="submit-btn">次へ</button>
      </div>

    </form>
  </div>

  <script>
    function selectTone(element, toneValue) {
      document.querySelectorAll('.tone-card').forEach(card => {
        card.classList.remove('selected');
      });
      element.classList.add('selected');
      
      document.getElementById('selectedTone').value = toneValue;
    }
  </script>
</body>
</html>
